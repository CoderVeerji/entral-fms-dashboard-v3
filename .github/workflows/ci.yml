name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # No local postgres:16 service container — the API's DB client (@neondatabase/serverless's
    # neon-http driver, required because Cloudflare Workers cannot open raw TCP sockets, see
    # packages/api/src/db.ts) can ONLY talk to a real Neon endpoint over HTTPS, not a generic
    # Postgres server. A local container reached "connection refused"/"fetch failed" every time
    # (real failure observed in CI: NeonDbError wrapping ECONNREFUSED). Testing against the same
    # real Neon database the app actually deploys against is what makes this exercise the real
    # code path — the DB-integration tests already scope every row they touch with a
    # timestamp-suffixed username/roleId and clean up in afterAll, so sharing the database with
    # production data is safe at this project's scale.
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (all packages)
        run: |
          npm exec -w packages/core -- tsc --noEmit
          npm exec -w packages/db -- tsc --noEmit
          npm exec -w packages/api -- tsc --noEmit
          npm exec -w packages/sync -- tsc --noEmit
          npm exec -w packages/web -- tsc -b --noEmit

      - name: Run tests (unit + DB-integration, against the real Neon database)
        run: npm test

      - name: Build web frontend
        working-directory: packages/web
        run: npx vite build
