name: Sync FMS data

# Runs every 5 minutes, matching the old app's warmFmsCache cadence — see plan §"Known risks":
# this workflow's repo needs to be PUBLIC for unlimited free Actions minutes at this cadence
# (288 runs/day comfortably exceeds the ~2,000 min/mo private-repo free allowance once per-run VM
# overhead is counted). No proprietary data lives in this repo — only generic, FMS-agnostic sync
# code; FMS spreadsheet IDs/credentials are secrets, never committed.
on:
  # TEMPORARILY PAUSED (2026-08-10): Neon's 5GB/month free network transfer allowance hit 100% —
  # every further query/write against Neon risks compute suspension for the rest of the billing
  # cycle. The content-diffing fix (see packages/sync/src/index.ts) cuts future usage drastically,
  # but doesn't undo what's already been consumed this cycle. Re-enable the schedule below once
  # Neon confirms the allowance has reset or headroom is otherwise confirmed safe.
  # schedule:
  #   - cron: '*/5 * * * *'
  workflow_dispatch: {} # manual "Sync Now" equivalent to the old app's button — still available

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run sync
        working-directory: packages/sync
        run: npm start
