name = "fms-dashboard-api"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# DATABASE_URL is a SECRET, never committed — set it with:
#   npx wrangler secret put DATABASE_URL
# (value comes from your free Neon project's connection string — see /README.md "Manual setup
# steps"). Local dev reads it from a gitignored .dev.vars file instead (see .dev.vars.example).

[observability]
enabled = true

# One cron, handled by src/index.ts's scheduled() export — fires the same GitHub workflow_dispatch
# call "Sync Now" makes (see sync.ts/dispatchGithubSync), on Cloudflare's own reliable schedule
# instead of relying on GitHub's own best-effort `schedule:` trigger (observed running 1-3 hours
# late instead of every 5 min). The actual sync logic stays in GitHub Actions; this is only the
# dispatch call. No separate keep-warm ping — this dispatch (and the sync run it triggers) keeps
# Neon's compute warm through the window below as a side effect.
#
# Scoped to office hours only (Mon-Sat, ~9AM-7PM IST = 3:00-13:59 UTC — cron's hour field can't
# express the exact :30 IST boundary, so this runs ~30min either side of 9-7, which is harmless):
# now on a paid usage-based Neon plan (2026-08-10, after the free tier's 5GB/month network
# transfer allowance was exhausted in under a week), every scheduled run costs real money, and
# there's no value paying to keep compute warm / auto-refresh data at 2am when nobody's watching
# the dashboard. A real request outside this window still works — it just pays a one-time
# cold-start delay instead of hitting already-warm compute. sync.yml's own `schedule:` trigger is
# scoped to the exact same window as a reliability backstop.
[triggers]
crons = ["*/5 3-13 * * 1-6"]
