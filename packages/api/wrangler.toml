name = "fms-dashboard-api"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# DATABASE_URL is a SECRET, never committed — set it with:
#   npx wrangler secret put DATABASE_URL
# (value comes from your free Neon project's connection string — see /README.md "Manual setup
# steps"). Local dev reads it from a gitignored .dev.vars file instead (see .dev.vars.example).

[observability]
enabled = true

# Two crons, both handled by src/index.ts's single scheduled() export (branches on event.cron):
#   */4 * * * *  — keeps Neon's free-tier compute from auto-suspending (under its ~5 min idle
#                  threshold) so real user requests don't pay the cold-start cost.
#   */5 * * * *  — fires the same GitHub workflow_dispatch call "Sync Now" makes, on Cloudflare's
#                  reliable schedule instead of relying on GitHub's own best-effort `schedule:`
#                  trigger (observed running 1-3 hours late instead of every 5 min — see plan
#                  §"M7" follow-up). The actual sync logic stays in GitHub Actions; this is only
#                  the dispatch call.
#
# TEMPORARILY DISABLED (2026-08-10): Neon's 5GB/month free network transfer allowance hit 100%
# and compute is at risk of suspension. This */5 cron dispatches the sync workflow independently
# of GitHub's own (now-commented-out) `schedule:` trigger in sync.yml — pausing sync.yml alone
# was NOT enough, this was still firing it. Both crons are paused (even the small */4 keep-warm
# ping) to stop ALL further Neon traffic until headroom is confirmed. Restore both entries once
# safe.
[triggers]
crons = []
