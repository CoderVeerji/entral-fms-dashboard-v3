name = "fms-dashboard-api"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# DATABASE_URL is a SECRET, never committed — set it with:
#   npx wrangler secret put DATABASE_URL
# (value comes from your free Neon project's connection string — see /README.md "Manual setup
# steps"). Local dev reads it from a gitignored .dev.vars file instead (see .dev.vars.example).

[observability]
enabled = true

# Keeps Neon's free-tier compute from auto-suspending (every 4 min, under its ~5 min idle
# threshold) so real user requests don't pay the multi-second/occasional-error cold-start cost —
# see src/index.ts's scheduled() handler and plan §"Known risks with the free/no-card constraint".
[triggers]
crons = ["*/4 * * * *"]
